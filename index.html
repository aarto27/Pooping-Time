<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pooping Time — Fun Edition</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game-wrap">
    <header class="hud">
      <div class="score">
        <div>My Score: <span id="myScore">0</span></div>
        <div>Top Score: <span id="topScore">0</span></div>
        <div class="combo" id="comboDisplay" title="Combo multiplier">Combo: x<span id="comboMul">1.0</span></div>
      </div>

      <!-- Top-right control cluster (Layout 1) -->
      <div class="hud-buttons">
        <button id="bucketBtn" class="bucket" aria-label="Clean screen (bucket)"><span>💧</span></button>
        <button id="pauseBtn" class="pause" aria-label="Pause game">⏸</button>
        <button id="soundBtn" class="sound" aria-label="Toggle sound">🔊</button>

        <div class="difficulty">
          <label for="diffSelect" class="diff-label">Difficulty</label>
          <select id="diffSelect" class="diff-select">
            <option value="easy">Easy</option>
            <option value="hard">Hard</option>
            <option value="insane">Insane</option>
          </select>
        </div>

        <button id="exitBtn" class="exit-btn">Exit</button>
      </div>
    </header>

    <section id="playArea" class="play-area">
      <button id="startBtn" class="start-btn">Start Pooping Time</button>
      <div id="pauseOverlay" class="overlay hidden">PAUSED</div>
    </section>

    <footer class="credits">
      <small>Click falling poop to stick it (fart + splatter). Click the bucket to flush. Combo when you stick poops quickly!</small>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
